<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blogs - Dhanusha K</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="topbar">
    <div class="path">~/dhanusha-k<span>/explore/blogs</span></div>
    <nav>
      <a href="index.html">Home</a>
      <a href="index.html#about">About</a>
      <a href="index.html#explore" class="active">Explore</a>
      <a href="index.html#contact">Contact</a>
    </nav>
  </div>

  <div class="bg-grid"></div>
  <div class="global-scan"></div>

  <main class="dir-page">
    <h1 class="explore-heading">BLOGS <span class="slash">/</span></h1>

    <a href="index.html#explore" class="dir-back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
      .. (parent directory)
    </a>

    <div class="dir-tiles" id="dirTiles"></div>
  </main>

  <div class="footerbar">
    <div class="hint" id="footerHint">3 items &middot; click to read</div>
  </div>

<script>
/*
  ===========================================================
  EDIT THIS LIST - each post is a real HTML page (living in
  the blogs/ folder)

  To add a new post:
    1. Duplicate blogs/blog_name.html
    2. Edit its title/meta/body
    3. Add a matching entry below pointing at the new file
  ===========================================================
*/
const ITEMS = [
  {
    "name": "Reflected XSS vs. DOM-Based XSS",
    "date": "05-09-2026",
    "type": "Article",
    "size": "8 min read",
    "path": "blogs/Reflected XSS vs. DOM-Based XSS.html"
  },
  {
    "name": "Session Fixation vs. Session Replay",
    "date": "12-09-2026",
    "type": "Article",
    "size": "5 min read",
    "path": "blogs/Session Fixation vs. Session Replay.html"
  },
  {
    "name": "CORS Misconfiguration&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;",
    "date": "19-09-2026",
    "type": "Article",
    "size": "10 min read",
    "path": "blogs/CORS Misconfiguration.html"
  },
  {
    "name": "CSRF vs. SSRF &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;",
    "date": "26-09-2026",
    "type": "Article",
    "size": "8 min read",
    "path": "blogs/CSRF vs. SSRF.html"
  },
  {
    "name": "Cache Poisoning &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;",
    "date": "03-10-2026",
    "type": "Article",
    "size": "Coming soon",
    "path": "blogs/CORS Misconfiguration.html"
  }
];

const dirTiles = document.getElementById('dirTiles');

ITEMS.forEach((item) => {
  const tile = document.createElement('div');
  tile.className = 'dir-tile';
  tile.setAttribute('role', 'button');
  tile.setAttribute('tabindex', '0');
  tile.innerHTML = `
    <div class="dir-tile-glare"></div>
    <svg class="tile-icon" viewBox="0 0 24 28">
      <path d="M2 1h13l7 7v19H2z"/>
      <path d="M15 1v7h7" fill="none"/>
    </svg>
    <div class="tile-name">${item.name}</div>
    <div class="tile-meta">
      <span>${item.date}</span>
      <span>${item.size}</span>
    </div>
  `;
  tile.addEventListener('click', () => { window.location.href = item.path; });
  tile.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') window.location.href = item.path;
  });

  // subtle 3D tilt following the cursor
  tile.addEventListener('mousemove', (e) => {
    const rect = tile.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const rotateX = ((y - rect.height / 2) / (rect.height / 2)) * -7;
    const rotateY = ((x - rect.width / 2) / (rect.width / 2)) * 7;
    tile.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-4px)`;
    tile.style.setProperty('--gx', `${(x / rect.width) * 100}%`);
    tile.style.setProperty('--gy', `${(y / rect.height) * 100}%`);
  });
  tile.addEventListener('mouseleave', () => {
    tile.style.transform = '';
  });

  dirTiles.appendChild(tile);
});

document.querySelectorAll('.topbar nav a[href="#"]').forEach(a => {
  a.addEventListener('click', (e) => e.preventDefault());
});
</script>

</body>
</html>
