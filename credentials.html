<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Credentials - Dhanusha K</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="topbar">
    <div class="path">~/dhanusha-k<span>/explore/credentials</span></div>
    <nav>
      <a href="index.html">Home</a>
      <a href="index.html#about">About</a>
      <a href="index.html#explore" class="active">Explore</a>
      <a href="index.html#contact">Contact</a>
    </nav>
  </div>

  <div class="bg-grid"></div>
  <div class="global-scan"></div>

  <a href="index.html#explore" class="dir-back-link" style="position:fixed; top:64px; left:48px; z-index:60;">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
    .. (parent directory)
  </a>

  <div class="cred-scene" id="credScene">
    <div class="cred-stage">

      <!-- ===================== SCREEN 1: STATS ===================== -->
      <div class="cred-layer cred-layer-stats" id="credStatsLayer">
        <div class="cred-screen">
          <h1 class="cred-heading">CREDENTIALS <span class="slash">/</span></h1>

          <div class="cred-stats-panel">
            <div class="cred-stats-title">Executive Summary</div>
            <div class="cred-stats-grid" id="credStatsGrid"></div>
          </div>
        </div>

        <div class="scroll-indicator" id="credScrollIndicator" role="button" tabindex="0" aria-label="Scroll for more">
          <div class="scroll-circle">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#e4202a" stroke-width="2">
              <path d="M12 4v16M6 14l6 6 6-6"/>
            </svg>
          </div>
        </div>
      </div>

      <!-- ===================== SCREEN 2: PROFILE + CERT ===================== -->
      <div class="cred-layer cred-layer-profile" id="credProfileLayer">
        <div class="cred-screen">
          <h1 class="cred-heading">PROFILE <span class="slash">/</span></h1>

          <div class="cred-profile-panel" id="credProfilePanel"></div>
        </div>
      </div>

    </div>
  </div>

  <div class="footerbar">
    <div class="hint" id="credFooterHint">scroll down to continue</div>
  </div>

  <div class="cert-modal" id="certModal" role="dialog" aria-modal="true" aria-label="File viewer">
    <div class="cert-modal-box">
      <div class="cert-modal-title">
        <span id="certModalLabel">FILE</span>
        <div style="display:flex; align-items:center; gap:14px;">
          <a id="certModalOpen" href="#" target="_blank" rel="noopener" style="color:var(--grey); text-decoration:none; letter-spacing:1px;">open in new tab &#8599;</a>
          <button type="button" class="cert-modal-close" id="certModalClose" aria-label="Close">&times;</button>
        </div>
      </div>
      <div class="cert-modal-body">
        <img id="certModalImg" alt="" style="display:none;">
        <iframe id="certModalFrame" title="" style="display:none;"></iframe>
        <div class="cert-modal-fallback" id="certModalFallback">
          File not added yet.<br>
          Drop it at <code id="certModalPath"></code> to display it here.
        </div>
      </div>
    </div>
  </div>

<script>
/*
  ===========================================================
  EDIT YOUR NUMBERS HERE - screen 1 stat counters.
  "suffix" (optional) renders after the number in a lighter
  red, e.g. value 120 + suffix "+" => "120+".
  ===========================================================
*/
const STATS = [
  { value: 35, suffix: "+", label: "Reports Delivered" },
  { value: 18, suffix: "+", label: "Projects Completed" },
  { value: 2, suffix: "+Yrs", label: "Experience in the Field", decimals: 0 }
];

/*
  ===========================================================
  EDIT YOUR PROFILE DETAILS HERE - screen 2 rows.
  Each row needs an icon (kept simple/generic), a title, and
  a description. The "sectors" row uses pills instead of a
  plain description; the "tools" row does too.
  ===========================================================
*/
const DEGREE = {
  name: "BSc-Computer-Science.pdf",
  sub: "BSc Computer Science",
  path: "creds/Degree Certificate.jpg"
};

const SECTOR_PILLS = ["Banking & Finance", "Healthcare", "Govt & Public"];
const TOOL_PILLS = [
  "Burp Suite", "Nmap", "Metasploit", "Nessus", "OWASP ZAP",
  "SQLmap", "Gobuster", "Wireshark", "Manual Testing"
];

const ICON_DEGREE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1.5 2.5 3 6 3s6-1.5 6-3v-5"/></svg>';
const ICON_SECTOR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>';
const ICON_TOOLS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.77z"/></svg>';

/* ===========================================================
   Rendering - no need to edit below unless restructuring layout
   =========================================================== */
const statsGrid = document.getElementById('credStatsGrid');
STATS.forEach(stat => {
  const el = document.createElement('div');
  el.className = 'cred-stat';
  el.innerHTML = `
    <div class="cred-stat-value"><span class="count" data-target="${stat.value}" data-decimals="${stat.decimals || 0}">0</span><span class="suffix">${stat.suffix || ''}</span></div>
    <div class="cred-stat-label">${stat.label}</div>
  `;
  statsGrid.appendChild(el);
});

const profilePanel = document.getElementById('credProfilePanel');
profilePanel.innerHTML = `
  <div class="cred-row">
    <div class="cred-row-icon">${ICON_DEGREE}</div>
    <div class="cred-row-body">
      <div class="cred-row-title">Education</div>
      <div class="cred-row-desc">${DEGREE.sub}</div>
      <div class="cred-cert-tile" id="degreeTile" role="button" tabindex="0">
        <svg viewBox="0 0 24 28"><path d="M2 1h13l7 7v19H2z"/><path d="M15 1v7h7" fill="none"/></svg>
        <div>
          <div class="cred-cert-name">${DEGREE.name}</div>
          <div class="cred-cert-sub">click to view certificate</div>
        </div>
      </div>
    </div>
  </div>
  <div class="cred-row">
    <div class="cred-row-icon">${ICON_SECTOR}</div>
    <div class="cred-row-body">
      <div class="cred-row-title">Sector Experience</div>
      <div class="cred-row-desc">Engagements spanning multiple industries, including:</div>
      <div class="cred-pills">${SECTOR_PILLS.map(p => `<span class="cred-pill">${p}</span>`).join('')}</div>
    </div>
  </div>
  <div class="cred-row">
    <div class="cred-row-icon">${ICON_TOOLS}</div>
    <div class="cred-row-body">
      <div class="cred-row-title">Tooling &amp; Technique</div>
      <div class="cred-row-desc">Hands-on with both automated scanners and manual testing methodology:</div>
      <div class="cred-pills">${TOOL_PILLS.map(p => `<span class="cred-pill">${p}</span>`).join('')}</div>
    </div>
  </div>
`;

document.getElementById('degreeTile').addEventListener('click', () => openFile(DEGREE));
document.getElementById('degreeTile').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' ') openFile(DEGREE);
});

/* ---------- count-up animation, runs once when screen 1 is reached ---------- */
let countStarted = false;
function animateCounts(){
  if (countStarted) return;
  countStarted = true;
  document.querySelectorAll('.count').forEach(el => {
    const target = parseFloat(el.dataset.target);
    const decimals = parseInt(el.dataset.decimals, 10) || 0;
    const duration = 1400;
    const start = performance.now();
    function tick(now){
      const progress = Math.min((now - start) / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      el.textContent = (target * eased).toFixed(decimals);
      if (progress < 1) requestAnimationFrame(tick);
      else el.textContent = target.toFixed(decimals);
    }
    requestAnimationFrame(tick);
  });
}

/* ---------- scroll-linked handoff between the two screens ---------- */
const scene = document.getElementById('credScene');
const statsLayer = document.getElementById('credStatsLayer');
const profileLayer = document.getElementById('credProfileLayer');
const footerHint = document.getElementById('credFooterHint');
const scrollIndicator = document.getElementById('credScrollIndicator');

const REDUCE_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function easeOutCubic(t){ return 1 - Math.pow(1 - t, 3); }
function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }

let ticking = false;
function update(){
  ticking = false;
  const rect = scene.getBoundingClientRect();
  const total = scene.offsetHeight - window.innerHeight;
  const raw = total > 0 ? clamp(-rect.top / total, 0, 1) : 0;
  const reveal = easeOutCubic(clamp(raw / 0.6, 0, 1));

  if (REDUCE_MOTION){
    statsLayer.style.opacity = 1 - reveal;
    profileLayer.style.opacity = reveal;
    statsLayer.style.transform = 'none';
    profileLayer.style.transform = 'none';
  } else {
    statsLayer.style.transform = `translateY(${reveal * -14}%)`;
    statsLayer.style.opacity = String(1 - reveal * 1.2);
    profileLayer.style.transform = `translateY(${(1 - reveal) * 100}%)`;
    profileLayer.style.opacity = String(Math.min(1, reveal * 1.4));
  }

  const profileActive = reveal > 0.5;
  statsLayer.style.pointerEvents = profileActive ? 'none' : 'auto';
  profileLayer.style.pointerEvents = profileActive ? 'auto' : 'none';
  if (footerHint) footerHint.style.visibility = profileActive ? 'hidden' : 'visible';

  if (raw > 0.05) animateCounts();
}

function onScroll(){
  if (!ticking){ ticking = true; requestAnimationFrame(update); }
}
window.addEventListener('scroll', onScroll, { passive: true });
update();

// if the whole page already fits in view (tall screen / few stats),
// make sure the counters still play instead of staying at zero
setTimeout(animateCounts, 600);

if (scrollIndicator){
  function scrollToProfile(){
    const total = scene.offsetHeight - window.innerHeight;
    window.scrollTo({ top: scene.offsetTop + total, behavior: 'smooth' });
  }
  scrollIndicator.addEventListener('click', scrollToProfile);
  scrollIndicator.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') scrollToProfile();
  });
}

/* ---------- certificate modal (same mechanism as the other listing pages) ---------- */
const certModal = document.getElementById('certModal');
const certModalImg = document.getElementById('certModalImg');
const certModalFrame = document.getElementById('certModalFrame');
const certModalFallback = document.getElementById('certModalFallback');
const certModalPath = document.getElementById('certModalPath');
const certModalLabel = document.getElementById('certModalLabel');
const certModalClose = document.getElementById('certModalClose');
const certModalOpen = document.getElementById('certModalOpen');

function openFile(item){
  certModalLabel.textContent = item.name.toUpperCase();
  certModalPath.textContent = item.path;
  if (certModalOpen) certModalOpen.href = item.path;
  certModalImg.style.display = 'none';
  certModalFrame.style.display = 'none';
  certModalFallback.style.display = 'none';

  const isPdf = item.path.toLowerCase().endsWith('.pdf');

  if (isPdf){
    certModalFrame.onload = () => { certModalFrame.style.display = 'block'; };
    certModalFrame.src = item.path;
    certModalFrame.style.display = 'block';
  } else {
    certModalImg.onload = () => { certModalImg.style.display = 'block'; };
    certModalImg.onerror = () => {
      certModalImg.style.display = 'none';
      certModalFallback.style.display = 'block';
    };
    certModalImg.alt = item.name;
    certModalImg.src = item.path;
  }

  certModal.classList.add('open');
  certModalClose.focus();
}

function closeCert(){
  certModal.classList.remove('open');
  certModalImg.src = '';
  certModalFrame.src = '';
}

if (certModalClose) certModalClose.addEventListener('click', closeCert);
if (certModal){
  certModal.addEventListener('click', (e) => {
    if (e.target === certModal) closeCert();
  });
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && certModal.classList.contains('open')) closeCert();
});

document.querySelectorAll('.topbar nav a[href="#"]').forEach(a => {
  a.addEventListener('click', (e) => e.preventDefault());
});
</script>

</body>
</html>
