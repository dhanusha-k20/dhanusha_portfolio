<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tools Built - Dhanusha K</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="topbar">
    <div class="path">~/dhanusha-k<span>/explore/tools_built</span></div>
    <nav>
      <a href="index.html">Home</a>
      <a href="index.html#about">About</a>
      <a href="index.html#explore" class="active">Explore</a>
      <a href="index.html#contact">Contact</a>
    </nav>
  </div>

  <div class="bg-grid"></div>
  <div class="global-scan"></div>

  <main class="dir-page">
    <h1 class="explore-heading">TOOLS BUILT <span class="slash">/</span></h1>

    <a href="index.html#explore" class="dir-back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
      .. (parent directory)
    </a>

    <div class="tool-cards" id="toolCards"></div>
  </main>

  <div class="footerbar">
    <div class="hint" id="footerHint">click a tool to open its GitHub page</div>
  </div>

<script>
/*
  ===========================================================
  EDIT THIS LIST — one entry per tool you've built.

  name    - tool name, shown next to the logo
  logo    - path to the tool's logo image. Drop the real file
            inside a "tools_built/" folder next to this page
            (e.g. tools_built/stacksniff-logo.png) and point
            this at it. If the file isn't there yet, a plain
            placeholder icon is shown instead - nothing breaks.
  tags    - pills shown bottom-left under the logo, each with
            its OWN link (e.g. a documentation PDF). Leave the
            array empty [] to show no pills.
            { label: "Documentation", path: "tools/your-doc.pdf" }
  status  - free text shown top-right ("In Progress",
            "Completed", "Live", "Archived", etc.)
  github  - the repo / profile URL. Clicking anywhere on the
            card EXCEPT a pill goes here.
  ===========================================================
*/
const TOOLS = [
  {
    name: "StackSniff",
    logo: "tools/stacksniff-logo.png",
    tags: [
      { label: "Documentation", path: "tools/stacksniff-Pre-documentation.pdf" }
    ],
    status: "In Progress",
    github: "https://github.com/dhanusha-k20/stacksniff"
  }
];

const PLACEHOLDER_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.77z"/></svg>`;

const toolCardsEl = document.getElementById('toolCards');

TOOLS.forEach((tool) => {
  const card = document.createElement('div');
  card.className = 'tool-card';

  const tagsHTML = (tool.tags && tool.tags.length)
    ? `<div class="tool-tags">${tool.tags.map(t => `<a class="tool-tag" href="${t.path}" target="_blank" rel="noopener">${t.label}</a>`).join('')}</div>`
    : '';

  card.innerHTML = `
    <a class="tool-card-link" href="${tool.github || '#'}" target="_blank" rel="noopener" aria-label="${tool.name} on GitHub"></a>
    <div class="tool-top">
      <div class="tool-logo">
        <img src="${tool.logo}" alt="${tool.name} logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <div class="tool-logo-fallback" style="display:none;">${PLACEHOLDER_ICON}</div>
      </div>
      <div class="tool-name">${tool.name}</div>
      <div class="tool-status">${tool.status || ''}</div>
    </div>
    ${tagsHTML}
  `;

  toolCardsEl.appendChild(card);
});

document.querySelectorAll('.topbar nav a[href="#"]').forEach(a => {
  a.addEventListener('click', (e) => e.preventDefault());
});
</script>

</body>
</html>
